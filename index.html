<h1>Jon Fleet Mail</h1>
<p>Jon Fleet Mail is a personal tool that lets Jon Kalkstein's own assistant notice replies to emails he is waiting on.</p>
<p>It has read-only access to Gmail and is used by a single person: Jon, on his own account. It never sends, changes, or deletes email.</p>
